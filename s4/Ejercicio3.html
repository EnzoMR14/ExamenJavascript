<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <div id="colores">
    <p> Bienvenido a esta página de prueba de colores </p> 
    </div>
        <input type="button" value="Azul" onclick="cambiarColor('blue');"/> </br> 
        <input type="button" value="Verde" onclick="cambiarColor('green');"/> </br> 
        <input type="button" value="Restablecer color inicial" onclick="cambiarColor('white');"/> </br> 

    <script>

         function cambiarColor(color) {
            document.getElementById("colores").style.backgroundColor = color;
        
      }

    </script>
    
</body>
</html>
