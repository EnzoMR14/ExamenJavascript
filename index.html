<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicios Examen JavaScript</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled />
</head>
<body>
  <header class="top">
    <h1>Ejercicios Examen</h1>
    <button id="tema" class="icono" type="button" aria-label="Cambiar entre modo claro y oscuro">☾</button>
  </header>

  <nav id="nav" class="nav" aria-label="Secciones"></nav>

  <main id="main"></main>

  <dialog id="visor">
    <div class="visor-barra">
      <strong id="visor-titulo">Ejercicio</strong>
      <span class="visor-acciones">
        <a id="visor-nueva" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
        <button id="visor-reiniciar" type="button">Reiniciar</button>
        <button id="visor-cerrar" class="icono" type="button" aria-label="Cerrar">×</button>
      </span>
    </div>
    <iframe id="visor-frame" title="Ejercicio en ejecución"></iframe>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="ejercicios.js"></script>
  <script src="app.js"></script>
</body>
</html>
