  <body>
    <p id="texto"></p>
    <button onclick="location.assign('http://Google.com')">Google</button> 
    <script>
      

        document.getElementById("texto").innerText='La URL actual es:' + location.href + "\n\n"

        'El protocol es ' + location.protocol;

    </script>
    
</body>
