<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Anexo 3</title>
</head>
<body>
   <form name="formulario">
      <input type="text" name="caja" value="0" />
      <input type="button" value="Sumar" onclick="sumar();" />
      <input type="button" value="Inicializar" onclick="inicializar();" /> 
    </form>
    <script>
        function sumar(){
            var valor = parseInt(document.formulario.caja.value);
            valor += 10;
            document.formulario.caja.value = valor;
        }
        function inicializar(){
            document.formulario.caja.value = 0;
        }


    </script>
    
</body>
</html>
