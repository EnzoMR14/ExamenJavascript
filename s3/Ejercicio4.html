<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Anexo 4</title>
</head>
<body>
    <script>
        var numero = parseInt(prompt("Introduce un número"));
        var aleatorio = Math.floor(Math.random() * 9) + 1;

        if (numero == aleatorio) {
            alert("¡Enhorabuena! Has acertado el número");
        } else {
            alert("Has fallado. El número era " + aleatorio);
        }

    </script>
    
</body>
</html>
