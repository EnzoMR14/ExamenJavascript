<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Anexo 2</title>
</head>
<body>
   <form action="#enviar" method="get">
       <label for="dni">DNI:</label>
       <input type="text" id="dni" name="dni" />
       <button onclick ="return comprobar();" type="submit">Enviar</button>
    </form>
    <script>
        function comprobar() {
          var dni = document.getElementById("dni").value;
            if (dni.length == 0) {
            alert("El campo DNI no tiene datos");
            return false;
            } else {
                alert("Formulario enviado correctamente");
                return true;
        }
    }

    </script>
    
</body>
</html>
