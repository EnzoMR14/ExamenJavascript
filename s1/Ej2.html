<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <script>
      var suma = 0;
      var numeros = [7, 8, 2, 9, 10];
      for (let i = 0; i <= numeros.length; i++) {
        if (numeros[i] > 8) {
          suma = suma + numeros[i];
        }
      }
      alert("La suma de los números mayores que 8 son:" + suma);
    </script>
  </body>
</html>
