<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
  </head>
  <h1>FORMULARIO</h1>
  <body>
    <form action="" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br>
    
        <label for="apellido">Apellidos:</label>
        <input type="text" id="apellido" name="apellido"><br>
    
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"><br>
  
        <label for="DNI">DNI:</label>
        <input type="text" id="DNI" name="DNI"><br>

        <label for="Edad">Edad:</label>
        <input type="number" id="Edad" name="Edad"><br>

        <label for="sexo">Sexo:</label> <br>
        <input type="radio" id="hombre" name="sexo" value="hombre">
        <label for="hombre">Hombre</label> <br>
        <input type="radio" id="mujer" name="sexo" value="mujer">
        <label for="mujer">Mujer</label><br>

        <label for="incluirfoto">Incluir mi foto:</label>

        <input type="file" id="incluirfoto" name="incluirfoto"><br>
        <input type="checkbox" id="checkbox" name="checkbox">
        <label for="checkbox">Enviar publicidad</label> <br>

        <label for="aficion">Elige tu afición favorita:</label>
        <select name="aficion" id="aficion">
            <option value="musica">Música</option>
            <option value="lectura">Lectura</option>
            <option value="deporte">Deporte</option>
        </select>
<br> <br>
        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones" rows="4" cols="30"></textarea><br>
        <input type="submit" value="Guardar cambios">
        <input type="reset" value="Borrar los datos introducidos">
    </form>

    <script src="Ejercicio1.js"></script>

  </body>

</html>
