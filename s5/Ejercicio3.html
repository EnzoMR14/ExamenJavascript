    <script>
      function numeroEnlaces() {
        var enlaces = document.getElementsByTagName("a");
        alert("Número total de enlaces: " + enlaces.length);
      }
      function referenciaEnlaces() {
        var enlaces = document.getElementsByTagName("a");
        var texto = "Referencias de los enlaces:\n";
        for (var i = 0; i < enlaces.length; i++) {
          texto += enlaces[i].href + "\n";
        }
        alert(texto);
      }

       function referenciaPorParrafo() {
        var parrafos = document.getElementsByTagName("p");
        var texto = "";
        for (var i = 0; i < parrafos.length; i++) {
          var enlaces = parrafos[i].getElementsByTagName("a");
          texto += "Párrafo " + (i + 1) + ":\n";
          for (var j = 0; j < enlaces.length; j++) {
            texto += "  " + enlaces[j].href + "\n";
          }
        }
        alert(texto);
      }


    </script>
